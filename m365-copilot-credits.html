<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microsoft 365 Copilot: included vs Copilot Credits</title>
<style>

:root{
  --yellow:#FFC53D;
  --offblack:#2E2E38;
  --confblack:#1A1A24;
  --offwhite:#F6F6FA;
  --gray01:#747480;
  --gray02:#C4C4CD;
  --green:#2DB757;   --green06:#168736;
  --red:#FF4136;     --red06:#B9251C;
  --orange:#FF6D00;  --orange06:#EB4F00;
  --teal:#27ACAA;    --teal06:#0D7575;
  --blue:#188CE5;    --blue06:#155CB4;
  --purple:#3D108A;  --maroon:#750E5C;
  --white:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--offblack);background:var(--offwhite);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:var(--blue06);}

/* ---------- HERO ---------- */
.hero{position:relative;background:var(--confblack);color:var(--white);padding:48px 24px 120px;overflow:hidden;}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(90deg,var(--yellow) 0%,var(--blue) 100%);}
.hero-inner{max-width:1080px;margin:0 auto;position:relative;z-index:2;}
.hero .logo{height:56px;margin-bottom:40px;display:block;}.wordmark{font-size:20px;font-weight:700;letter-spacing:.02em;color:var(--white);margin-bottom:40px;}.wordmark::before{content:"";display:inline-block;width:10px;height:20px;background:var(--yellow);margin-right:10px;vertical-align:-3px;border-radius:2px;}.wordmark.foot{margin-bottom:0;font-size:16px;}a.wordmark{text-decoration:none;color:var(--white);}a.wordmark:hover{color:var(--yellow);}.wordmark.foot{color:var(--offblack);}a.wordmark.foot:hover{color:var(--blue06);}.topnav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:40px;}.topnav .wordmark{margin-bottom:0;}.homelink{font-size:13px;font-weight:700;color:var(--white);text-decoration:none;border:1px solid rgba(255,255,255,.42);border-radius:20px;padding:8px 15px;white-space:nowrap;transition:all .14s ease;}.homelink:hover{border-color:var(--yellow);color:var(--yellow);}
.eyebrow{display:inline-block;background:var(--yellow);color:var(--offblack);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border-radius:2px;margin-bottom:22px;}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.06;font-weight:700;max-width:900px;margin-bottom:18px;}
.hero h1 .hl{color:var(--yellow);}
.hero p.sub{font-size:clamp(16px,2vw,20px);font-weight:300;max-width:720px;color:#e8e8ef;}
.hero-cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;}
.btn{font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;border:none;padding:15px 30px;border-radius:4px;transition:transform .12s ease,box-shadow .12s ease;text-decoration:none;display:inline-flex;align-items:center;gap:10px;}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:var(--yellow);color:var(--offblack);box-shadow:0 6px 18px rgba(255,230,0,.28);}
.btn-ghost{background:transparent;color:var(--white);border:2px solid rgba(255,255,255,.55);}
.btn-ghost:hover{border-color:var(--yellow);color:var(--yellow);}
.hero-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:46px;}
.hstat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:16px 20px;min-width:150px;}
.hstat .k{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);font-weight:700;}
.hstat .v{font-size:15px;font-weight:300;color:#e8e8ef;margin-top:4px;}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
.section{padding:64px 0;}
.section-head{margin-bottom:34px;}
.section-head .kicker{color:var(--gray01);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;}
.section-head h2{font-size:clamp(24px,3.4vw,36px);font-weight:700;margin-top:8px;color:var(--offblack);}
.section-head p{color:var(--gray01);font-size:16px;max-width:680px;margin-top:10px;}

/* ---------- WIZARD ---------- */
.wizard{margin-top:-84px;position:relative;z-index:5;background:var(--white);border-radius:16px;box-shadow:0 24px 60px rgba(46,46,56,.16);overflow:hidden;border:1px solid #ececf3;}
.wizard-top{background:var(--offblack);color:var(--white);padding:22px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.wizard-top .t{display:flex;align-items:center;gap:12px;}
.wizard-top .beam{height:26px;}
.wizard-top h3{font-size:18px;font-weight:700;}
.progress{display:flex;gap:8px;align-items:center;}
.pdot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.22);transition:all .25s;}
.pdot.active{background:var(--yellow);transform:scale(1.25);}
.pdot.done{background:var(--green);}
.wizard-body{padding:34px 30px 38px;}
.breadcrumb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;min-height:10px;}
.crumb{font-family:inherit;font-size:12.5px;background:var(--offwhite);border:1px solid var(--gray02);color:var(--offblack);border-radius:20px;padding:5px 13px;font-weight:700;cursor:pointer;transition:all .12s ease;}
.crumb:hover{border-color:var(--offblack);background:#fffdf0;}
.crumb .q{color:var(--gray01);font-weight:400;}
.step{animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.qnum{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue06);}
.qtext{font-size:clamp(21px,2.8vw,28px);font-weight:700;margin:8px 0 24px;color:var(--offblack);}
.options{display:grid;gap:12px;}
.opt{text-align:left;font-family:inherit;cursor:pointer;background:var(--white);border:2px solid #e4e4ec;border-radius:10px;padding:17px 20px;font-size:16px;font-weight:400;color:var(--offblack);transition:all .14s ease;display:flex;align-items:center;gap:15px;}
.opt:hover{border-color:var(--yellow);background:#fffdf0;transform:translateX(4px);box-shadow:0 4px 14px rgba(46,46,56,.08);}
.opt .ic{flex:0 0 34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--white);}
.opt .ol{flex:1;}
.opt .oc{color:var(--gray01);font-size:13.5px;margin-top:2px;font-weight:400;display:block;}
.opt .arw{color:var(--gray02);font-size:20px;font-weight:700;transition:color .14s;}
.opt:hover .arw{color:var(--offblack);}

/* result card */
.result{animation:fade .35s ease;border-radius:12px;overflow:hidden;border:1px solid #ececf3;}
.result-band{padding:26px 28px;color:var(--white);display:flex;align-items:center;gap:18px;}
.result-band .badge-ic{flex:0 0 56px;height:56px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:30px;}
.result-band .verdict{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9;}
.result-band h4{font-size:clamp(20px,3vw,26px);font-weight:700;margin-top:2px;}
.result-body{background:var(--white);padding:24px 28px;}
.result-body .lead{font-size:16px;color:var(--offblack);margin-bottom:18px;}
.rfacts{display:grid;gap:10px;}
.rfact{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;background:var(--offwhite);border-radius:8px;padding:12px 14px;}
.rfact .lab{font-weight:700;color:var(--gray01);flex:0 0 118px;text-transform:uppercase;font-size:11.5px;letter-spacing:.06em;padding-top:2px;}
.rfact .val{flex:1;color:var(--offblack);}
.result-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;}
.btn-sm{padding:11px 20px;font-size:14.5px;border-radius:5px;}
.btn-dark{background:var(--offblack);color:var(--white);}
.btn-dark:hover{background:var(--confblack);}
.btn-line{background:transparent;border:2px solid var(--gray02);color:var(--offblack);}
.btn-line:hover{border-color:var(--offblack);}
.fair-note{margin-top:20px;display:flex;gap:12px;align-items:flex-start;background:#fffdf0;border:1px solid var(--yellow);border-left:6px solid var(--yellow);border-radius:8px;padding:14px 16px;font-size:14px;color:var(--offblack);}

/* verdict colors — one class per outcome type declared in CONFIG.verdictTypes */
.v-good  .result-band{background:linear-gradient(120deg,var(--green06),var(--green));}
.v-bad   .result-band{background:linear-gradient(120deg,var(--red06),var(--red));}
.v-info  .result-band{background:linear-gradient(120deg,var(--teal06),var(--teal));}
.v-warn  .result-band{background:linear-gradient(120deg,var(--orange06),var(--orange));}
.v-alt   .result-band{background:linear-gradient(120deg,var(--blue06),var(--blue));}

/* ---------- REFERENCE ---------- */
.ref-grid{display:grid;gap:20px;grid-template-columns:1fr 1fr;}
@media(max-width:820px){.ref-grid{grid-template-columns:1fr;}}
.card{background:var(--white);border-radius:14px;border:1px solid #ececf3;box-shadow:0 8px 24px rgba(46,46,56,.06);overflow:hidden;}
.card.wide{grid-column:1 / -1;}
.card-head{padding:18px 22px;color:var(--white);display:flex;align-items:center;gap:12px;}
.card-head .ci{font-size:22px;}
.card-head h3{font-size:17px;font-weight:700;line-height:1.2;}
.card-head .cs{font-size:12.5px;opacity:.92;font-weight:300;display:block;}
.ch-good{background:linear-gradient(120deg,var(--green06),var(--green));}
.ch-bad{background:linear-gradient(120deg,var(--red06),var(--red));}
.ch-info{background:linear-gradient(120deg,var(--blue06),var(--blue));}
.ch-warn{background:linear-gradient(120deg,var(--orange06),var(--orange));}
.ch-dark{background:var(--offblack);}
.card table{width:100%;border-collapse:collapse;font-size:13.5px;}
.card th{text-align:left;background:var(--offwhite);color:var(--gray01);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-bottom:1px solid #ececf3;font-weight:700;}
.card td{padding:11px 16px;border-bottom:1px solid #f1f1f6;vertical-align:top;}
.card tr:last-child td{border-bottom:none;}
.card td:first-child{font-weight:700;color:var(--offblack);}
.card.wide th{background:var(--offblack);color:var(--white);font-size:12px;padding:12px 16px;}
.card.wide tr:nth-child(even) td{background:#fafafd;}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.pill-good{background:#e6f7ec;color:var(--green06);}
.pill-bad{background:#ffe9e7;color:var(--red06);}
.pill-warn{background:#fff0e2;color:var(--orange06);}
.pill-info{background:#e7f2fd;color:var(--blue06);}

.rule{grid-column:1 / -1;background:var(--offblack);color:var(--white);border-radius:14px;padding:30px 32px;display:flex;gap:22px;align-items:flex-start;position:relative;overflow:hidden;}
.rule::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--yellow);}
.rule .ri{font-size:40px;flex:0 0 auto;line-height:1;}
.rule h3{color:var(--yellow);font-size:16px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.rule p{font-size:16px;font-weight:300;color:#eeeef4;}
.rule p b{font-weight:700;color:var(--white);}

/* ---------- FOOTER ---------- */
footer{background:var(--white);border-top:1px solid #ececf3;padding:40px 24px;}
.foot-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.foot-inner img{height:46px;}
.foot-inner .ftxt{font-size:12.5px;color:var(--gray01);max-width:640px;}
.foot-inner .ftxt b{color:var(--offblack);}
@media(max-width:640px){
  .wizard-body{padding:26px 18px 30px;}
  .rfact{flex-direction:column;gap:2px;}
  .rfact .lab{flex:none;}
}
</style>
</head>

<div class="wrap">

const CONFIG = {

  h1: 'Microsoft 365 Copilot:<br><span class="hl">included</span> vs when <span class="hl">Copilot Credits</span> are consumed',
  sub: 'Answer up to three questions about your scenario and this guide routes you straight to the answer, then shows the exact credit rate that applies if the activity is billable.',

        ['Voice, classic orchestration, per minute','10 credits','Core agent activity included'],
        ['Voice, GenAI, per minute','35 credits','Core agent activity included'],
        ['Voice, premium GenAI, per minute','75 credits','Core agent activity included']
      ]},

    {head:'good', icon:'&#10003;', title:'What the licence includes', sub:'Employee-facing usage, licensed user, own identity',
      columns:['Included','Condition'],
      rows:[
        ['Agents in Copilot Chat, Teams and SharePoint','Classic answers, generative answers, tenant graph grounding are zero-rated'],
        ['Microsoft 365 Copilot Chat, including Pages','Part of the licence'],
        ['Copilot in Microsoft 365 apps, including Teams','Part of the licence'],
        ['SharePoint agents','Part of the licence'],
        ['Agent capabilities built in Copilot Studio','When used in M365 Copilot, Teams or SharePoint'],
        ['Agent flow actions','<span class="pill pill-warn">Only</span> via the "When an agent calls the flow" trigger'],
        ['Copilot Analytics and SharePoint Advanced Management','Part of the licence'],
        ['Testing agents and agent flows','<span class="pill pill-good">Always free</span>, and exempt from enforcement']
      ]},

    {head:'bad', icon:'&#9889;', title:'What consumes credits', sub:'No inclusion applies',
      columns:['Scenario','Why'],
      rows:[
        ['External or customer-facing agents','The inclusion is employee-facing only'],
        ['Unlicensed internal users','No M365 Copilot licence to zero-rate against'],
        ['Autonomous or event-triggered runs','No authenticated licensed user identity behind the run'],
        ['Computer-Using Agents','Explicitly excluded from the licence'],
        ['Agent flows on any other trigger','Only one trigger carries the inclusion'],
        ['Prompts in standalone apps or cloud flows','AI Builder prompt licensing applies instead'],
        ['Usage beyond fair-usage limits','The inclusion is bounded by fair usage'],
        ['Bring-your-own-model, including Azure Foundry','Billed separately from Copilot Studio rates']
      ]},

    {wide:true, head:'warn', icon:'&#9888;', title:'Capacity and enforcement', sub:'What happens when the credits run out',
      columns:['Rule','Detail'],
      rows:[
        ['Pooling','Purchased credits are pooled across the tenant and can be allocated per environment.'],
        ['No rollover','Capacity is enforced monthly and unused credits do not carry over.'],
        ['Overage grace','Some overage is allowed rather than blocking business processes immediately.'],
        ['Agent enforcement','At 125% of prepaid capacity custom agents are disabled. In-flight conversations finish; new invocations are rejected.'],
        ['What users see','"There is a billing issue" or "This agent is currently unavailable. It has reached its usage limit."'],
        ['Agent flow enforcement','Once prepaid capacity is fully consumed, new agent flow runs are blocked but the agent keeps answering.'],
        ['Exemptions','Runs by licensed users via the agent-calls-flow trigger, and test runs.'],
        ['Ways out','Reallocate capacity, buy more credits, or link an Azure subscription for pay-as-you-go, which removes enforcement.'],
        ['Per-agent caps','Monthly consumption limits can be set per agent in the Power Platform admin center.'],
        ['Ways to buy','Pay-as-you-go via Azure, prepaid credit packs, or a one-year prepurchase of commit units.']
      ]},

    {wide:true, head:'info', icon:'&#9881;', title:'Same capability, different cost by context', sub:'Where a prompt or flow runs decides the meter',
      columns:['Where it runs','Who uses it','Cost'],
      rows:[
        ['Inside a Copilot Studio agent','Licensed employee, own identity','<span class="pill pill-good">No charge</span>'],
        ['Inside a Copilot Studio agent','Unlicensed, external or autonomous','<span class="pill pill-bad">Copilot Credits</span>'],
        ['Standalone app or cloud flow prompt','Anyone','<span class="pill pill-warn">AI Builder prompt licensing</span>'],
        ['Agent flow, "When an agent calls the flow"','Licensed employee','<span class="pill pill-good">No charge</span>'],
        ['Agent flow, any other trigger','Anyone, including licensed','<span class="pill pill-bad">Copilot Credits</span>'],
        ['Plain Power Automate cloud flow, no AI','Anyone','<span class="pill pill-good">Power Automate licensing</span>']
      ]}
  ],

  rule:{icon:'&#128161;', title:'Rule of thumb',
    text:'If a <b>licensed employee</b> is interacting with the agent under their <b>own identity</b>, it is <b>included</b>, including the AI tools the agent invokes. If the consumer is <b>external</b> or <b>unlicensed</b>, or the agent runs <b>autonomously</b>, uses a <b>Computer-Using Agent</b>, or fires an agent flow from <b>any trigger other than "When an agent calls the flow"</b>, it <b>consumes Copilot Credits</b>. And included does not mean unlimited: fair-usage limits still apply.'},

  footer:'<b>Licensing decision guide</b> — rates and rules compiled from Microsoft Learn: Copilot Studio billing rates and management, licensing for agents powered by the standard harness, and AI Builder prompt licensing. Verified 4 August 2026. Copilot Credits replaced messages as the billing currency on 1 September 2025. Microsoft changes rates, inclusions and fair-usage limits frequently, and the Copilot Studio Licensing Guide is the authoritative source — confirm there before committing to a design or a budget.'
};

/* CONFIG-END */

/* ============================ RENDERER ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&(?![a-zA-Z#0-9]+;)/g,'&amp;').replace(/<(?![a-z\/!])/g,'&lt;');
const COLORS = ['#188CE5','#2DB757','#FF6D00','#27ACAA','#750E5C','#3D108A','#FF4136'];
const ICONS = {good:'&#10003;', bad:'&#9889;', info:'&#9733;', warn:'&#9881;', alt:'&#8505;'};

document.title = CONFIG.title;
$('wiz-title').innerHTML = CONFIG.wizardTitle;
$('foot-txt').innerHTML = CONFIG.footer;
$('hero-copy').innerHTML =
  (CONFIG.eyebrow ? '<div class="eyebrow">'+CONFIG.eyebrow+'</div>' : '') +
  '<h1>'+CONFIG.h1+'</h1><p class="sub">'+CONFIG.sub+'</p>' +
  '<div class="hero-cta">'+ (CONFIG.ctas||[]).map(c=>
    '<a class="btn '+(c.style||'btn-primary')+'" href="'+c.href+'">'+c.label+'</a>').join('') +'</div>'+
  '<div class="hero-stats">'+ (CONFIG.stats||[]).map(s=>
    '<div class="hstat"><span class="k">'+s.k+'</span><span class="v">'+s.v+'</span></div>').join('') +'</div>';
$('progress').innerHTML = Array.from({length:CONFIG.steps},()=>'<span class="pdot"></span>').join('');
$('ref-head').innerHTML = '<div class="kicker">'+CONFIG.refKicker+'</div><h2>'+CONFIG.refHeading+'</h2>'+
  (CONFIG.refIntro?'<p>'+CONFIG.refIntro+'</p>':'');
$('ref-grid').innerHTML = (CONFIG.cards||[]).map(c=>
  '<div class="card'+(c.wide?' wide':'')+'">'+
    '<div class="card-head ch-'+(c.head||'info')+'"><span class="ci">'+(c.icon||'')+'</span>'+
      '<div><h3>'+c.title+'</h3><span class="cs">'+(c.sub||'')+'</span></div></div>'+
    '<table><thead><tr>'+c.columns.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
      c.rows.map(r=>'<tr>'+r.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>').join('') +
  (CONFIG.rule ? '<div class="rule"><div class="ri">'+CONFIG.rule.icon+'</div><div><h3>'+
    CONFIG.rule.title+'</h3><p>'+CONFIG.rule.text+'</p></div></div>' : '');

let path = [];
function setProgress(step, isResult){
  $('progress').querySelectorAll('.pdot').forEach((d,i)=>{
    d.className = 'pdot';
    if(isResult){ d.classList.add('done'); return; }
    if(i < step-1) d.classList.add('done'); else if(i === step-1) d.classList.add('active');
  });
}
function renderCrumbs(){
  $('breadcrumb').innerHTML = '';
  path.forEach((p,idx)=>{
    const el = document.createElement('button');
    el.className = 'crumb'; el.title = 'Jump back to this question';
    el.innerHTML = '<span class="q">'+p.short+':</span> '+esc(p.answer);
    el.onclick = ()=>{ const t = p.node; path = path.slice(0,idx); show(t); };
    $('breadcrumb').appendChild(el);
  });
}
function show(id){ CONFIG.nodes[id] ? showNode(id) : showResult(id); }
function showNode(id){
  const n = CONFIG.nodes[id];
  setProgress(n.step,false); renderCrumbs();
  $('stage').innerHTML = '<div class="step"><div class="qnum">Question '+n.step+'</div>'+
    '<div class="qtext">'+n.q+'</div><div class="options">'+
    n.options.map((o,i)=>'<button class="opt" onclick="choose(\''+id+'\','+i+')">'+
      '<span class="ic" style="background:'+COLORS[i%COLORS.length]+'">'+(i+1)+'</span>'+
      '<span class="ol">'+esc(o.l)+'<span class="oc">'+esc(o.c||'')+'</span></span>'+
      '<span class="arw">&rarr;</span></button>').join('')+'</div></div>';
}
function choose(nodeId,i){
  const n = CONFIG.nodes[nodeId], o = n.options[i];
  path.push({short:'Q'+n.step, answer:o.l, node:nodeId, idx:i});
  show(o.go);
}
function showResult(rid){
  const r = CONFIG.results[rid];
  setProgress(CONFIG.steps,true); renderCrumbs();
  $('stage').innerHTML = '<div class="result v-'+r.type+'">'+
    '<div class="result-band"><div class="badge-ic">'+(ICONS[r.type]||'')+'</div>'+
      '<div><div class="verdict">'+r.verdict+'</div><h4>'+r.title+'</h4></div></div>'+
    '<div class="result-body"><div class="lead">'+r.lead+'</div><div class="rfacts">'+
      (r.facts||[]).map(f=>'<div class="rfact"><span class="lab">'+f[0]+'</span><span class="val">'+f[1]+'</span></div>').join('')+
    '</div>'+
    (r.note ? '<div class="fair-note"><span>&#9888;&#65039;</span><div>'+CONFIG.noteText+'</div></div>' : '')+
    '<div class="result-actions">'+
      '<button class="btn btn-sm btn-dark" onclick="back()">&larr; Change last answer</button>'+
      '<button class="btn btn-sm btn-line" onclick="restart()">Start over</button>'+
      '<a class="btn btn-sm btn-line" href="#reference">See full reference</a>'+
    '</div></div></div>';
}
function back(){ path.pop(); replay(); }
function restart(){ path = []; replay(); }
function replay(){
  if(!path.length){ show(Object.keys(CONFIG.nodes)[0]); return; }
  let node = Object.keys(CONFIG.nodes)[0];
  for(const p of path){ node = CONFIG.nodes[p.node].options[p.idx].go; }
  show(node);
}
replay();
</script>
</body>
</html>
