<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Platform environments: Developer vs Sandbox vs Production</title>
<style>

:root{
  --yellow:#FFC53D;
  --offblack:#2E2E38;
  --confblack:#1A1A24;
  --offwhite:#F6F6FA;
  --gray01:#747480;
  --gray02:#C4C4CD;
  --green:#2DB757;   --green06:#168736;
  --red:#FF4136;     --red06:#B9251C;
  --orange:#FF6D00;  --orange06:#EB4F00;
  --teal:#27ACAA;    --teal06:#0D7575;
  --blue:#188CE5;    --blue06:#155CB4;
  --purple:#3D108A;  --maroon:#750E5C;
  --white:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--offblack);background:var(--offwhite);line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:var(--blue06);}

/* ---------- HERO ---------- */
.hero{position:relative;background:var(--confblack);color:var(--white);padding:48px 24px 120px;overflow:hidden;}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
  background:linear-gradient(90deg,var(--yellow) 0%,var(--blue) 100%);}
.hero-inner{max-width:1080px;margin:0 auto;position:relative;z-index:2;}
.hero .logo{height:56px;margin-bottom:40px;display:block;}.wordmark{font-size:20px;font-weight:700;letter-spacing:.02em;color:var(--white);margin-bottom:40px;}.wordmark::before{content:"";display:inline-block;width:10px;height:20px;background:var(--yellow);margin-right:10px;vertical-align:-3px;border-radius:2px;}.wordmark.foot{margin-bottom:0;font-size:16px;}
.eyebrow{display:inline-block;background:var(--yellow);color:var(--offblack);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;border-radius:2px;margin-bottom:22px;}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.06;font-weight:700;max-width:900px;margin-bottom:18px;}
.hero h1 .hl{color:var(--yellow);}
.hero p.sub{font-size:clamp(16px,2vw,20px);font-weight:300;max-width:720px;color:#e8e8ef;}
.hero-cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;}
.btn{font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;border:none;padding:15px 30px;border-radius:4px;transition:transform .12s ease,box-shadow .12s ease;text-decoration:none;display:inline-flex;align-items:center;gap:10px;}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:var(--yellow);color:var(--offblack);box-shadow:0 6px 18px rgba(255,230,0,.28);}
.btn-ghost{background:transparent;color:var(--white);border:2px solid rgba(255,255,255,.55);}
.btn-ghost:hover{border-color:var(--yellow);color:var(--yellow);}
.hero-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:46px;}
.hstat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:16px 20px;min-width:150px;}
.hstat .k{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);font-weight:700;}
.hstat .v{font-size:15px;font-weight:300;color:#e8e8ef;margin-top:4px;}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
.section{padding:64px 0;}
.section-head{margin-bottom:34px;}
.section-head .kicker{color:var(--gray01);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;}
.section-head h2{font-size:clamp(24px,3.4vw,36px);font-weight:700;margin-top:8px;color:var(--offblack);}
.section-head p{color:var(--gray01);font-size:16px;max-width:680px;margin-top:10px;}

/* ---------- WIZARD ---------- */
.wizard{margin-top:-84px;position:relative;z-index:5;background:var(--white);border-radius:16px;box-shadow:0 24px 60px rgba(46,46,56,.16);overflow:hidden;border:1px solid #ececf3;}
.wizard-top{background:var(--offblack);color:var(--white);padding:22px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.wizard-top .t{display:flex;align-items:center;gap:12px;}
.wizard-top .beam{height:26px;}
.wizard-top h3{font-size:18px;font-weight:700;}
.progress{display:flex;gap:8px;align-items:center;}
.pdot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.22);transition:all .25s;}
.pdot.active{background:var(--yellow);transform:scale(1.25);}
.pdot.done{background:var(--green);}
.wizard-body{padding:34px 30px 38px;}
.breadcrumb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;min-height:10px;}
.crumb{font-family:inherit;font-size:12.5px;background:var(--offwhite);border:1px solid var(--gray02);color:var(--offblack);border-radius:20px;padding:5px 13px;font-weight:700;cursor:pointer;transition:all .12s ease;}
.crumb:hover{border-color:var(--offblack);background:#fffdf0;}
.crumb .q{color:var(--gray01);font-weight:400;}
.step{animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.qnum{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue06);}
.qtext{font-size:clamp(21px,2.8vw,28px);font-weight:700;margin:8px 0 24px;color:var(--offblack);}
.options{display:grid;gap:12px;}
.opt{text-align:left;font-family:inherit;cursor:pointer;background:var(--white);border:2px solid #e4e4ec;border-radius:10px;padding:17px 20px;font-size:16px;font-weight:400;color:var(--offblack);transition:all .14s ease;display:flex;align-items:center;gap:15px;}
.opt:hover{border-color:var(--yellow);background:#fffdf0;transform:translateX(4px);box-shadow:0 4px 14px rgba(46,46,56,.08);}
.opt .ic{flex:0 0 34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--white);}
.opt .ol{flex:1;}
.opt .oc{color:var(--gray01);font-size:13.5px;margin-top:2px;font-weight:400;display:block;}
.opt .arw{color:var(--gray02);font-size:20px;font-weight:700;transition:color .14s;}
.opt:hover .arw{color:var(--offblack);}

/* result card */
.result{animation:fade .35s ease;border-radius:12px;overflow:hidden;border:1px solid #ececf3;}
.result-band{padding:26px 28px;color:var(--white);display:flex;align-items:center;gap:18px;}
.result-band .badge-ic{flex:0 0 56px;height:56px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:30px;}
.result-band .verdict{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9;}
.result-band h4{font-size:clamp(20px,3vw,26px);font-weight:700;margin-top:2px;}
.result-body{background:var(--white);padding:24px 28px;}
.result-body .lead{font-size:16px;color:var(--offblack);margin-bottom:18px;}
.rfacts{display:grid;gap:10px;}
.rfact{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;background:var(--offwhite);border-radius:8px;padding:12px 14px;}
.rfact .lab{font-weight:700;color:var(--gray01);flex:0 0 118px;text-transform:uppercase;font-size:11.5px;letter-spacing:.06em;padding-top:2px;}
.rfact .val{flex:1;color:var(--offblack);}
.result-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;}
.btn-sm{padding:11px 20px;font-size:14.5px;border-radius:5px;}
.btn-dark{background:var(--offblack);color:var(--white);}
.btn-dark:hover{background:var(--confblack);}
.btn-line{background:transparent;border:2px solid var(--gray02);color:var(--offblack);}
.btn-line:hover{border-color:var(--offblack);}
.fair-note{margin-top:20px;display:flex;gap:12px;align-items:flex-start;background:#fffdf0;border:1px solid var(--yellow);border-left:6px solid var(--yellow);border-radius:8px;padding:14px 16px;font-size:14px;color:var(--offblack);}

/* verdict colors — one class per outcome type declared in CONFIG.verdictTypes */
.v-good  .result-band{background:linear-gradient(120deg,var(--green06),var(--green));}
.v-bad   .result-band{background:linear-gradient(120deg,var(--red06),var(--red));}
.v-info  .result-band{background:linear-gradient(120deg,var(--teal06),var(--teal));}
.v-warn  .result-band{background:linear-gradient(120deg,var(--orange06),var(--orange));}
.v-alt   .result-band{background:linear-gradient(120deg,var(--blue06),var(--blue));}

/* ---------- REFERENCE ---------- */
.ref-grid{display:grid;gap:20px;grid-template-columns:1fr 1fr;}
@media(max-width:820px){.ref-grid{grid-template-columns:1fr;}}
.card{background:var(--white);border-radius:14px;border:1px solid #ececf3;box-shadow:0 8px 24px rgba(46,46,56,.06);overflow:hidden;}
.card.wide{grid-column:1 / -1;}
.card-head{padding:18px 22px;color:var(--white);display:flex;align-items:center;gap:12px;}
.card-head .ci{font-size:22px;}
.card-head h3{font-size:17px;font-weight:700;line-height:1.2;}
.card-head .cs{font-size:12.5px;opacity:.92;font-weight:300;display:block;}
.ch-good{background:linear-gradient(120deg,var(--green06),var(--green));}
.ch-bad{background:linear-gradient(120deg,var(--red06),var(--red));}
.ch-info{background:linear-gradient(120deg,var(--blue06),var(--blue));}
.ch-warn{background:linear-gradient(120deg,var(--orange06),var(--orange));}
.ch-dark{background:var(--offblack);}
.card table{width:100%;border-collapse:collapse;font-size:13.5px;}
.card th{text-align:left;background:var(--offwhite);color:var(--gray01);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-bottom:1px solid #ececf3;font-weight:700;}
.card td{padding:11px 16px;border-bottom:1px solid #f1f1f6;vertical-align:top;}
.card tr:last-child td{border-bottom:none;}
.card td:first-child{font-weight:700;color:var(--offblack);}
.card.wide th{background:var(--offblack);color:var(--white);font-size:12px;padding:12px 16px;}
.card.wide tr:nth-child(even) td{background:#fafafd;}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.pill-good{background:#e6f7ec;color:var(--green06);}
.pill-bad{background:#ffe9e7;color:var(--red06);}
.pill-warn{background:#fff0e2;color:var(--orange06);}
.pill-info{background:#e7f2fd;color:var(--blue06);}

.rule{grid-column:1 / -1;background:var(--offblack);color:var(--white);border-radius:14px;padding:30px 32px;display:flex;gap:22px;align-items:flex-start;position:relative;overflow:hidden;}
.rule::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--yellow);}
.rule .ri{font-size:40px;flex:0 0 auto;line-height:1;}
.rule h3{color:var(--yellow);font-size:16px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.rule p{font-size:16px;font-weight:300;color:#eeeef4;}
.rule p b{font-weight:700;color:var(--white);}

/* ---------- FOOTER ---------- */
footer{background:var(--white);border-top:1px solid #ececf3;padding:40px 24px;}
.foot-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.foot-inner img{height:46px;}
.foot-inner .ftxt{font-size:12.5px;color:var(--gray01);max-width:640px;}
.foot-inner .ftxt b{color:var(--offblack);}
@media(max-width:640px){
  .wizard-body{padding:26px 18px 30px;}
  .rfact{flex-direction:column;gap:2px;}
  .rfact .lab{flex:none;}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="wordmark">Power Platform Learning</div>
    <div id="hero-copy"></div>
  </div>
</header>

<div class="wrap">
  <section class="wizard" id="decide">
    <div class="wizard-top">
      <div class="t"><h3 id="wiz-title"></h3></div>
      <div class="progress" id="progress"></div>
    </div>
    <div class="wizard-body">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="stage"></div>
    </div>
  </section>

  <section class="section" id="reference">
    <div class="section-head" id="ref-head"></div>
    <div class="ref-grid" id="ref-grid"></div>
  </section>
</div>

<footer>
  <div class="foot-inner">
    <div class="wordmark foot">Power Platform Learning</div>
    <div class="ftxt" id="foot-txt"></div>
  </div>
</footer>

<script>
/* =====================================================================
   EDIT ONLY THIS CONFIG OBJECT TO CREATE A NEW MICRO SITE.
   Everything below CONFIG is a generic renderer — leave it alone.
   build.ps1 -Config sites\<name>.js swaps everything between the markers.
   ===================================================================== */
/* CONFIG-START */
// PUBLIC EDITION - no internal links, no brand assets. Sources: Microsoft Learn only.
// Sources (Microsoft Learn, checked Aug 2026): admin/environments-overview,
// developer/plan, admin/backup-restore-environments, admin/copy-environment,
// alm/environment-strategy-alm.
// Build:  .\build.ps1 -Config .\sites\pp-environments.js
const CONFIG = {
  title: 'Power Platform environments: Developer vs Sandbox vs Production',
  eyebrow: 'Environment strategy guide',
  h1: 'Power Platform environments:<br>when to use <span class="hl">Developer</span>, <span class="hl">Sandbox</span> or <span class="hl">Production</span>',
  sub: 'Answer up to three questions about who will use the environment and what it must do, and this guide routes you to the right environment type — plus the licensing, capacity and backup consequences of that choice.',
  ctas: [
    {label:'Start the guide &nbsp;&rarr;', href:'#decide', style:'btn-primary'},
    {label:'Browse the comparison tables', href:'#reference', style:'btn-ghost'}
  ],
  stats: [
    {k:'Developer', v:'Free, owner-only, 2 GB, dev/test only'},
    {k:'Sandbox', v:'Shared dev + test, copy / reset / restore target'},
    {k:'Production', v:'Anything real users depend on'}
  ],
  wizardTitle: 'Which environment type do I need?',
  steps: 3,

  nodes: {
    q1:{step:1, q:'What will this environment be used for?', options:[
      {l:'My own learning, a spike or a personal demo', c:'I am the only maker; nobody depends on it', go:'q2'},
      {l:'Team development of a solution that will ship', c:'Several makers, source control / pipelines, a real ALM chain', go:'r_sandbox_dev'},
      {l:'Testing, UAT, training or release validation', c:'Needs a copy of production schema, or of production data', go:'r_sandbox_test'},
      {l:'Live business use by real users', c:'Real data, real processes, people depend on it', go:'q3'},
      {l:'A short evaluation I will throw away', c:'Trying a feature out for a few weeks', go:'r_trial'}
    ]},
    q2:{step:2, q:'What does your personal build work actually need?', options:[
      {l:'Only Power Apps, Power Automate and Dataverse', c:'Under 2 GB of data and 750 flow runs a month', go:'r_dev'},
      {l:'Dynamics 365 apps, dataflows, AI Builder or RPA', c:'Capabilities the Developer Plan does not include', go:'r_sandbox_dev'},
      {l:'Access controlled by a security group', c:'Or more than a handful of named makers', go:'r_sandbox_dev'},
      {l:'A copy of production data or schema', c:'Debugging against something that looks like prod', go:'r_sandbox_test'},
      {l:'Other people to run the app for their day job', c:'Not just help me build it', go:'r_prod'}
    ]},
    q3:{step:3, q:'How critical is the live workload?', options:[
      {l:'Business-critical, regulated or handling sensitive data', c:'Needs longer backup retention, DLP isolation, governance', go:'r_prod_managed'},
      {l:'A normal departmental or team app', c:'Important, but standard risk', go:'r_prod'},
      {l:'One person\u2019s personal productivity, nothing depends on it', c:'No integrations, no shared data, disposable', go:'r_default'}
    ]}
  },

  results: {
    r_dev:{type:'alt', verdict:'Use a Developer environment', title:'Developer environment (Power Apps Developer Plan)',
      lead:'Free, owner-scoped, and the right place to learn, prototype and test premium and custom connectors without touching shared environments.',
      facts:[
        ['License','Power Apps Developer Plan — free, but it is a viral/internal license your admin must allow in the tenant.'],
        ['Limits','2 GB Dataverse database and 750 flow runs per month. No add-ons: if you hit the ceiling you need a paid plan.'],
        ['Not included','Dataflows, Dynamics 365 apps, AI Builder use rights and Power Automate RPA use rights.'],
        ['Access','Intended for the owner. Coworkers can be added manually as makers/admins, but security groups cannot be assigned.'],
        ['Lifecycle','Up to three per user; auto-disabled after 30 days of inactivity; admins can block creation entirely.'],
        ['Capacity','Its entitlements do not count against your tenant quota — the cheapest way to give makers room.'],
        ['Ship path','Export as a solution and import into sandbox, then production. Apps show a developer-environment banner until they move.']
      ], note:true},

    r_sandbox_dev:{type:'warn', verdict:'Use a Sandbox environment', title:'Sandbox as your shared development environment',
      lead:'Sandbox gives you full control plus the capabilities the Developer Plan lacks, and it is the type a real dev → test → prod chain is built on.',
      facts:[
        ['Why not developer','Developer environments cap out at 2 GB / 750 flow runs, exclude dataflows and Dynamics 365 apps, and cannot be scoped with a security group.'],
        ['Seeding it','Copy from production with "Customizations and schemas only" to get prod schema and users without prod data — the documented pattern for iterative team development and PoCs.'],
        ['Capacity','Consumes tenant Dataverse capacity; you need at least 1 GB free to create or copy an environment.'],
        ['Governance','Admins can restrict who provisions sandboxes; separate dev environments keep unfinished work from colliding.'],
        ['Later','A sandbox can be converted to production once the solution is ready to serve users.'],
        ['Region','Keep dev/test in the same or an earlier service-update station than production — you cannot reliably import a solution into an older-version environment.']
      ], note:false},

    r_sandbox_test:{type:'warn', verdict:'Use a Sandbox environment', title:'Sandbox for test, UAT, training or debugging on prod-like data',
      lead:'Sandbox is the only non-production type that can receive a copy or a restore, which is exactly what test, UAT and training need.',
      facts:[
        ['Copy level','"Everything" (data + users + customizations) for UAT, upgrade testing and training; "Customizations and schemas only" when the data must not leave production.'],
        ['Target rules','You can copy only to a sandbox or preview environment — never to production, and never from or to default or trial environments.'],
        ['Restore rules','Production and sandbox backups can only be restored into a sandbox. Same region, and managed only to managed.'],
        ['After the copy','The target lands in administration mode with background operations disabled. Review flows, connection references and custom connectors before you re-enable.'],
        ['Timing','Copy and restore typically take up to 8 hours, and up to 24 if you include large or audit data — plan the UAT window around it.'],
        ['Reset','Reset wipes a sandbox back to empty, which no production environment allows.']
      ], note:false},

    r_prod:{type:'good', verdict:'Use a Production environment', title:'Production environment',
      lead:'Anything real users depend on belongs in production. It is the only type Microsoft positions for permanent work.',
      facts:[
        ['Who can create','An admin, or anyone with a Power Apps license, provided 1 GB of database capacity is free.'],
        ['Licensing','Users need real licenses — a Developer Plan cannot launch premium apps outside a developer environment.'],
        ['Backups','System and manual backups retained 7 days by default (28 only for production managed environments).'],
        ['Restore caveat','You cannot restore directly over production: switch the type to sandbox, restore, then switch straight back — while it is a sandbox you can only reach backups from the last 7 days.'],
        ['Not a copy target','Production never appears in the copy/restore target list, which is the guard against accidental overwrites.'],
        ['Pair it','Always keep at least one separate test environment so the deployment itself gets tested, not just the app.']
      ], note:false},

    r_prod_managed:{type:'good', verdict:'Production + Managed Environment', title:'Production environment, enabled as a Managed Environment',
      lead:'Business-critical or regulated workloads need production plus the governance layer: longer backup retention, sharing limits and tenant-wide visibility.',
      facts:[
        ['Backup retention','Only production managed environments can extend retention beyond 7 days, to 14, 21 or 28 days (admin center or PowerShell).'],
        ['Licensing cost','Managed Environment use rights are not included in the Developer Plan — every user running assets there needs a premium license.'],
        ['Restore pairing','A managed environment can only be restored from another managed environment; plan your test environment to match.'],
        ['Isolation','Give the workload its own environment rather than sharing one, so DLP policies, security groups and capacity are scoped to it.'],
        ['Encryption','If you apply a customer-managed key, every copy/restore target must carry the same key.']
      ], note:false},

    r_default:{type:'bad', verdict:'Do not build here', title:'The default environment is not an environment strategy',
      lead:'It is fine for a throwaway personal flow and wrong for everything else. Move anything with a dependency into its own environment.',
      facts:[
        ['Shared by everyone','One per tenant, shared by all users, and every licensed user automatically gets the Environment Maker role.'],
        ['No guarantees','Microsoft states it provides no backup guarantees and should not be used for production workloads.'],
        ['Cannot be undone','You cannot delete it, cannot take a manual backup, and cannot restore a backup over it — a default backup can only be restored into a developer environment.'],
        ['Cannot be copied','Copy operations cannot use a default environment as source or target.'],
        ['Better','Rename it something like "Personal Productivity", secure it, and create a production environment for anything real.']
      ], note:false},

    r_trial:{type:'info', verdict:'Use a Trial environment', title:'Trial environment — for short evaluations only',
      lead:'Trials are designed to be thrown away, so never let anything you care about live in one.',
      facts:[
        ['Lifetime','Expires after 30 days, limited to one per user, and automatically cleaned up.'],
        ['No safety net','Trial environments are not backed up at all, and backup/restore is unsupported.'],
        ['No copy','You cannot copy from or to a trial environment.'],
        ['If it works out','Convert the trial to production to get the full feature set, including backup and restore.']
      ], note:false}
  },
  noteText: '<b>Developer environments are for development and test only.</b> Production use of a Developer Plan environment is outside the plan terms, and the environment is disabled after 30 days without activity — never let a business process end up depending on one.',

  refKicker: 'Full reference',
  refHeading: 'Developer, Sandbox and Production side by side',
  refIntro: 'Everything the guide is built on, drawn from the Microsoft Learn environment, Developer Plan, backup/restore and copy articles.',
  cards: [
    {head:'info', icon:'&#128187;', title:'Developer environment', sub:'Free, owner-scoped, dev/test only',
      columns:['Fact','Detail'],
      rows:[
        ['License','Power Apps Developer Plan (viral/internal — admin must allow it)'],
        ['Cost','Free; capacity does not count against tenant quota'],
        ['Database size','2 GB, no add-ons available'],
        ['Flow runs','750 per month'],
        ['Dataflows','<span class="pill pill-bad">Not available</span>'],
        ['Dynamics 365 apps','<span class="pill pill-bad">Cannot be installed</span>'],
        ['AI Builder / RPA rights','<span class="pill pill-bad">Not included</span> (trials only)'],
        ['Security groups','<span class="pill pill-bad">Cannot be assigned</span>; add users manually'],
        ['Backups','System + manual, 7 days'],
        ['Limits','Up to 3 per user; disabled after 30 days of inactivity'],
        ['Apps','Show a developer-environment banner until moved out']
      ]},

    {head:'warn', icon:'&#128295;', title:'Sandbox environment', sub:'Non-production: shared dev, test, UAT, training',
      columns:['Capability','Detail'],
      rows:[
        ['Intended use','Development and testing, separate from production'],
        ['Copy','<span class="pill pill-good">Supported</span> — "Everything" or "Customizations and schemas only"'],
        ['Copy target','<span class="pill pill-good">Yes</span> — sandbox/preview are the only valid targets'],
        ['Restore target','<span class="pill pill-good">Yes</span> — where production backups must land'],
        ['Reset','<span class="pill pill-good">Supported</span> — wipe back to empty'],
        ['Convert','Can be promoted to production later'],
        ['Security groups','Supported; full admin control'],
        ['Capacity','Consumes tenant capacity; 1 GB free needed to create/copy/restore'],
        ['Backups','System + manual, 7 days'],
        ['After a copy','Lands in administration mode, background operations disabled']
      ]},

    {head:'good', icon:'&#10003;', title:'Production environment', sub:'Permanent business work, real users',
      columns:['Fact','Detail'],
      rows:[
        ['Intended use','Anything your organization depends on'],
        ['Created by','Admin, or any Power Apps licensed user with 1 GB free capacity'],
        ['Backups','7 days system + manual; 28 days only as a managed environment'],
        ['Restore over it','<span class="pill pill-bad">Not directly</span> — switch to sandbox, restore, switch back'],
        ['Copy target','<span class="pill pill-bad">Never</span> — protects against overwrites'],
        ['Deleted by mistake','Recoverable within 7 days (28 with Dynamics 365 apps)'],
        ['Governance','Managed Environments, DLP policies, security groups, customer-managed key'],
        ['Pair with','At least one separate test environment (ALM minimum)']
      ]},

    {head:'bad', icon:'&#9888;', title:'Default environment', sub:'The one everybody accidentally builds in',
      columns:['Fact','Detail'],
      rows:[
        ['Who has access','Every licensed user in the tenant is an Environment Maker'],
        ['Backup guarantee','<span class="pill pill-bad">None</span>; not for production workloads'],
        ['Manual backup','<span class="pill pill-bad">Not supported</span>'],
        ['Restore over it','<span class="pill pill-bad">Not supported</span> — restore its backup to a developer environment'],
        ['Copy','Cannot be a copy source or target'],
        ['Storage','1 TB cap; 3 GB DB + 3 GB file + 1 GB log included'],
        ['Delete','<span class="pill pill-bad">Impossible</span>'],
        ['Do instead','Rename it, secure it, and treat it as personal productivity only']
      ]},

    {wide:true, head:'dark', icon:'&#9776;', title:'Decision matrix', sub:'Same question asked of each type',
      columns:['Question','Developer','Sandbox','Production'],
      rows:[
        ['Real end users allowed?','<span class="pill pill-bad">No</span>','<span class="pill pill-warn">Testers only</span>','<span class="pill pill-good">Yes</span>'],
        ['Counts against tenant capacity?','<span class="pill pill-good">No</span>','Yes (1 GB min)','Yes (1 GB min)'],
        ['Max Dataverse database','2 GB','Your allocated capacity','Your allocated capacity'],
        ['Security groups','<span class="pill pill-bad">No</span>','<span class="pill pill-good">Yes</span>','<span class="pill pill-good">Yes</span>'],
        ['Dynamics 365 apps / dataflows','<span class="pill pill-bad">No</span>','<span class="pill pill-good">Yes</span>','<span class="pill pill-good">Yes</span>'],
        ['Can be a copy target','<span class="pill pill-bad">No</span>','<span class="pill pill-good">Yes</span>','<span class="pill pill-bad">No</span>'],
        ['Can be a restore target','<span class="pill pill-good">Yes</span>','<span class="pill pill-good">Yes</span>','<span class="pill pill-bad">No</span> (switch to sandbox first)'],
        ['Reset supported','<span class="pill pill-good">Yes</span>','<span class="pill pill-good">Yes</span>','<span class="pill pill-bad">No</span>'],
        ['Backup retention','7 days','7 days','7 days (28 if managed)'],
        ['Auto-cleanup','Disabled after 30 days idle','None','None'],
        ['Cost','Free','Tenant capacity','Tenant capacity + user licenses']
      ]},

    {wide:true, head:'info', icon:'&#128260;', title:'A minimum viable ALM chain', sub:'What Microsoft recommends you actually stand up',
      columns:['Stage','Environment type','Why'],
      rows:[
        ['Personal spike / learning','Developer','Free, isolated, no tenant capacity consumed'],
        ['Team development','Sandbox (one per work stream if changes collide)','Security groups, full feature set, seed with schema-only copy'],
        ['Test / UAT / training','Sandbox','Only valid copy and restore target; tests the deployment, not just the app'],
        ['Production','Production (managed if business-critical)','Permanent work, backups, governance, real licensing']
      ]}
  ],

  rule:{icon:'&#128161;', title:'Rule of thumb',
    text:'<b>Developer</b> = one maker, free, throwaway, never production. <b>Sandbox</b> = shared development and every kind of testing, because it is the only type that can receive a copy or a restore. <b>Production</b> = the moment anyone other than the maker depends on it. And the <b>default environment</b> is not a strategy — nothing that matters should live there. If your organisation publishes its own ALM standard, and it is stricter than these product defaults, follow the internal standard.'},

  footer:'<b>Environment strategy guide</b> — product behaviour compiled from Microsoft Learn (environments overview, Power Apps Developer Plan, back up and restore environments, copy an environment, ALM environment strategy), verified August 2026. Microsoft changes limits and licensing terms frequently, and your organisation may enforce a stricter ALM standard than the product defaults shown here — confirm both before committing to a design.'
};

/* CONFIG-END */

/* ============================ RENDERER ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&(?![a-zA-Z#0-9]+;)/g,'&amp;').replace(/<(?![a-z\/!])/g,'&lt;');
const COLORS = ['#188CE5','#2DB757','#FF6D00','#27ACAA','#750E5C','#3D108A','#FF4136'];
const ICONS = {good:'&#10003;', bad:'&#9889;', info:'&#9733;', warn:'&#9881;', alt:'&#8505;'};

document.title = CONFIG.title;
$('wiz-title').innerHTML = CONFIG.wizardTitle;
$('foot-txt').innerHTML = CONFIG.footer;
$('hero-copy').innerHTML =
  (CONFIG.eyebrow ? '<div class="eyebrow">'+CONFIG.eyebrow+'</div>' : '') +
  '<h1>'+CONFIG.h1+'</h1><p class="sub">'+CONFIG.sub+'</p>' +
  '<div class="hero-cta">'+ (CONFIG.ctas||[]).map(c=>
    '<a class="btn '+(c.style||'btn-primary')+'" href="'+c.href+'">'+c.label+'</a>').join('') +'</div>'+
  '<div class="hero-stats">'+ (CONFIG.stats||[]).map(s=>
    '<div class="hstat"><span class="k">'+s.k+'</span><span class="v">'+s.v+'</span></div>').join('') +'</div>';
$('progress').innerHTML = Array.from({length:CONFIG.steps},()=>'<span class="pdot"></span>').join('');
$('ref-head').innerHTML = '<div class="kicker">'+CONFIG.refKicker+'</div><h2>'+CONFIG.refHeading+'</h2>'+
  (CONFIG.refIntro?'<p>'+CONFIG.refIntro+'</p>':'');
$('ref-grid').innerHTML = (CONFIG.cards||[]).map(c=>
  '<div class="card'+(c.wide?' wide':'')+'">'+
    '<div class="card-head ch-'+(c.head||'info')+'"><span class="ci">'+(c.icon||'')+'</span>'+
      '<div><h3>'+c.title+'</h3><span class="cs">'+(c.sub||'')+'</span></div></div>'+
    '<table><thead><tr>'+c.columns.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+
      c.rows.map(r=>'<tr>'+r.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>').join('') +
  (CONFIG.rule ? '<div class="rule"><div class="ri">'+CONFIG.rule.icon+'</div><div><h3>'+
    CONFIG.rule.title+'</h3><p>'+CONFIG.rule.text+'</p></div></div>' : '');

let path = [];
function setProgress(step, isResult){
  $('progress').querySelectorAll('.pdot').forEach((d,i)=>{
    d.className = 'pdot';
    if(isResult){ d.classList.add('done'); return; }
    if(i < step-1) d.classList.add('done'); else if(i === step-1) d.classList.add('active');
  });
}
function renderCrumbs(){
  $('breadcrumb').innerHTML = '';
  path.forEach((p,idx)=>{
    const el = document.createElement('button');
    el.className = 'crumb'; el.title = 'Jump back to this question';
    el.innerHTML = '<span class="q">'+p.short+':</span> '+esc(p.answer);
    el.onclick = ()=>{ const t = p.node; path = path.slice(0,idx); show(t); };
    $('breadcrumb').appendChild(el);
  });
}
function show(id){ CONFIG.nodes[id] ? showNode(id) : showResult(id); }
function showNode(id){
  const n = CONFIG.nodes[id];
  setProgress(n.step,false); renderCrumbs();
  $('stage').innerHTML = '<div class="step"><div class="qnum">Question '+n.step+'</div>'+
    '<div class="qtext">'+n.q+'</div><div class="options">'+
    n.options.map((o,i)=>'<button class="opt" onclick="choose(\''+id+'\','+i+')">'+
      '<span class="ic" style="background:'+COLORS[i%COLORS.length]+'">'+(i+1)+'</span>'+
      '<span class="ol">'+esc(o.l)+'<span class="oc">'+esc(o.c||'')+'</span></span>'+
      '<span class="arw">&rarr;</span></button>').join('')+'</div></div>';
}
function choose(nodeId,i){
  const n = CONFIG.nodes[nodeId], o = n.options[i];
  path.push({short:'Q'+n.step, answer:o.l, node:nodeId, idx:i});
  show(o.go);
}
function showResult(rid){
  const r = CONFIG.results[rid];
  setProgress(CONFIG.steps,true); renderCrumbs();
  $('stage').innerHTML = '<div class="result v-'+r.type+'">'+
    '<div class="result-band"><div class="badge-ic">'+(ICONS[r.type]||'')+'</div>'+
      '<div><div class="verdict">'+r.verdict+'</div><h4>'+r.title+'</h4></div></div>'+
    '<div class="result-body"><div class="lead">'+r.lead+'</div><div class="rfacts">'+
      (r.facts||[]).map(f=>'<div class="rfact"><span class="lab">'+f[0]+'</span><span class="val">'+f[1]+'</span></div>').join('')+
    '</div>'+
    (r.note ? '<div class="fair-note"><span>&#9888;&#65039;</span><div>'+CONFIG.noteText+'</div></div>' : '')+
    '<div class="result-actions">'+
      '<button class="btn btn-sm btn-dark" onclick="back()">&larr; Change last answer</button>'+
      '<button class="btn btn-sm btn-line" onclick="restart()">Start over</button>'+
      '<a class="btn btn-sm btn-line" href="#reference">See full reference</a>'+
    '</div></div></div>';
}
function back(){ path.pop(); replay(); }
function restart(){ path = []; replay(); }
function replay(){
  if(!path.length){ show(Object.keys(CONFIG.nodes)[0]); return; }
  let node = Object.keys(CONFIG.nodes)[0];
  for(const p of path){ node = CONFIG.nodes[p.node].options[p.idx].go; }
  show(node);
}
replay();
</script>
</body>
